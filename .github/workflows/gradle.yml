name: Build Effective Colors

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle executable
        working-directory: effective-colors-template-26.2
        run: chmod +x gradlew

      - name: Build Fabric mod
        working-directory: effective-colors-template-26.2
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EffectiveColors-Minecraft-26.2
          path: effective-colors-template-26.2/build/libs/*.jar
